<div class="busqueda-wrap">
  <!-- Barra principal -->
  <div class="busqueda-barra">
    <input
      class="busqueda-input"
      type="text"
      [(ngModel)]="nombre"
      (keyup.enter)="buscar()"
      placeholder="🔍 Buscar por nombre, especialidad..."
    />
    <button class="btn-buscar" (click)="buscar()">Buscar</button>
    <button class="btn-filtros" (click)="mostrarFiltros = !mostrarFiltros">
      {{ mostrarFiltros ? '▲ Ocultar' : '▼ Filtros' }}
    </button>
  </div>

  <!-- Filtros avanzados -->
  <div *ngIf="mostrarFiltros" class="filtros-panel">
    <div class="filtros-grid">
      <div class="filtro-campo">
        <label>Especialización / Palabras clave</label>
        <input
          type="text"
          [(ngModel)]="especializacion"
          placeholder="Ej: Python, Marketing, Diseño..."
        />
      </div>
      <div class="filtro-campo">
        <label>Ordenar por</label>
        <select [(ngModel)]="ordenar">
          <option value="relevancia">Relevancia (Premium primero)</option>
          <option value="precio_bajo">Precio: Menor a Mayor</option>
          <option value="precio_alto">Precio: Mayor a Menor</option>
        </select>
      </div>
      <div class="filtro-campo">
        <label>Tarifa mínima (€/h)</label>
        <input type="number" [(ngModel)]="presupuestoMin" placeholder="0" min="0" />
      </div>
      <div class="filtro-campo">
        <label>Tarifa máxima (€/h)</label>
        <input type="number" [(ngModel)]="presupuestoMax" placeholder="1000" min="0" />
      </div>
    </div>
    <div class="filtros-acciones">
      <button class="btn-limpiar" (click)="limpiarFiltros()">✕ Limpiar</button>
      <button class="btn-aplicar" (click)="buscar()">Aplicar Filtros</button>
    </div>
  </div>
</div>
