<div class="login-page">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <span class="logo-m">m</span><span class="logo-o">o</span><span class="logo-labora">labora</span>
    </div>
    <p class="login-subtitulo">Accede a tu cuenta</p>

    <!-- Alerta error -->
    <div *ngIf="mensaje" class="alert alert-error">{{ mensaje }}</div>

    <form (ngSubmit)="entrar()">
      <div class="campo">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="credenciales.email"
          placeholder="usuario@ejemplo.com"
          required
        />
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="credenciales.password"
          placeholder="Tu contraseña"
          required
        />
      </div>

      <button type="submit" class="btn-entrar" [disabled]="cargando">
        {{ cargando ? '⏳ Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="login-footer">
      <p>¿Aún no tienes cuenta?</p>
      <a routerLink="/registro">Regístrate gratis</a>
    </div>
  </div>
</div>
