<div class="login">
  <h2>Entrar en Molabora</h2>
  
  <form>
    <div class="campo">
      <label>Nombre de usuario o Email:</label><br>
      <input type="text" placeholder="Tu identificación">
    </div>

    <div class="campo">
      <label>Contraseña:</label><br>
      <input type="password" placeholder="Tu clave secreta">
    </div>

    <button type="button">Entrar</button>
  </form>

  <hr>
  <p>¿Aún no tienes cuenta? <a routerLink="/registro">Crea una aquí</a></p>
</div>
