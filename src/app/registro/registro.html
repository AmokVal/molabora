<div class="registro">
  <h2>Crear cuenta en Molabora</h2>
  
  <form>
    <div class="campo">
      <label>Nombre completo:</label><br>
      <input type="text" placeholder="Escribe tu nombre">
    </div>

    <div class="campo">
      <label>Estudios:</label><br>
      <input type="text" placeholder="Titulaciones o formación">
    </div>

    <div class="campo">
      <label>Experiencia:</label><br>
      <textarea placeholder="Cuéntanos tu trayectoria"></textarea>
    </div>

    <div class="campo">
      <label>Localización:</label><br>
      <input type="text" placeholder="Ciudad o provincia">
    </div>

    <div class="campo">
      <label>Tipo de perfil:</label><br>
      <select>
        <option value="cliente">Busco un especialista (Cliente)</option>
        <option value="especialista">Ofrezco mis servicios (Especialista)</option>
      </select>
    </div>

    <button type="button">Finalizar Registro</button>
  </form>

  <p>¿Ya tienes cuenta? <a routerLink="/login">Haz login aquí</a></p>
</div>
